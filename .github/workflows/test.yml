name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./expressSum/package-lock.json

      - name: Install dependencies  
        working-directory: ./expressSum
        run: npm ci

      - name: Run tests
        working-directory: ./expressSum
        run: npm run test
